name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The build never connects to this; Prisma and Next only need a well-formed value.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: bash scripts/check-em-dash.sh
